name: Release Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-and-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build source zip and jar
        run: ./gradlew clean sourceZip prepareReleaseInput --no-daemon --console=plain

      - name: Upload source zip and jar
        uses: actions/upload-artifact@v4
        with:
          name: source-and-jar
          path: |
            build/release/EdamameAgent-source.zip
            build/release/EdamameAgent.jar
          if-no-files-found: error

  deb-installer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev

      - name: Build deb installer
        run: ./gradlew clean packageDebInstaller --no-daemon --console=plain

      - name: Upload deb installer
        uses: actions/upload-artifact@v4
        with:
          name: deb-installer
          path: build/release/EdamameAgent.deb
          if-no-files-found: error

  exe-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build exe installer
        run: .\gradlew.bat clean packageExeInstaller --no-daemon --console=plain

      - name: Upload exe installer
        uses: actions/upload-artifact@v4
        with:
          name: exe-installer
          path: build/release/EdamameAgent.exe
          if-no-files-found: error

  create-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [source-and-jar, deb-installer, exe-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/source-and-jar/EdamameAgent-source.zip \
            release-assets/source-and-jar/EdamameAgent.jar \
            release-assets/deb-installer/EdamameAgent.deb \
            release-assets/exe-installer/EdamameAgent.exe \
            --verify-tag \
            --generate-notes
