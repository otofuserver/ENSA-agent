name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  source-and-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build source zip and jar
        run: ./gradlew clean sourceZip prepareReleaseInput --no-daemon --console=plain

      - name: Upload source zip and jar
        uses: actions/upload-artifact@v4
        with:
          name: source-and-jar
          path: |
            build/release/EdamameAgent-source.zip
            build/release/EdamameAgent.jar
          if-no-files-found: error

  deb-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev

      - name: Build deb installer
        run: ./gradlew clean packageDebInstaller --no-daemon --console=plain

      - name: Upload deb installer
        uses: actions/upload-artifact@v4
        with:
          name: deb-installer
          path: build/release/EdamameAgent.deb
          if-no-files-found: error

  exe-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build exe installer
        run: .\gradlew.bat clean packageExeInstaller --no-daemon --console=plain

      - name: Upload exe installer
        uses: actions/upload-artifact@v4
        with:
          name: exe-installer
          path: build/release/EdamameAgent.exe
          if-no-files-found: error

  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [source-and-jar, deb-installer, exe-installer]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.zip
            release-assets/**/*.jar
            release-assets/**/*.deb
            release-assets/**/*.exe
