name: Release Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-and-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Build source zip and jar
        run: ./gradlew clean sourceZip prepareReleaseInput --no-daemon --console=plain

      - name: Upload source zip and jar
        uses: actions/upload-artifact@v5
        with:
          name: source-and-jar
          path: |
            build/release/EdamameAgent-source.zip
            build/release/EdamameAgent.jar
          if-no-files-found: error

  deb-installer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Build deb installer
        run: ./gradlew clean packageDebInstaller --no-daemon --console=plain

      - name: Normalize deb artifact name
        run: |
          DEB_PATH="$(find build/release -type f -name '*.deb' | head -n 1)"
          if [ -z "$DEB_PATH" ]; then
            echo "No .deb file found under build/release"
            exit 1
          fi
          if [ "$(basename "$DEB_PATH")" != "EdamameAgent.deb" ]; then
            cp "$DEB_PATH" build/release/EdamameAgent.deb
          fi

      - name: Upload deb installer
        uses: actions/upload-artifact@v5
        with:
          name: deb-installer
          path: build/release/EdamameAgent.deb
          if-no-files-found: error

  exe-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build exe installer
        run: .\gradlew.bat clean packageExeInstaller --no-daemon --console=plain

      - name: Normalize exe artifact name
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "build/release" -Recurse -File -Filter "*.exe" | Select-Object -First 1
          if ($null -eq $exe) {
            throw "No .exe file found under build/release"
          }
          $target = (Resolve-Path "build/release").Path + "\\EdamameAgent.exe"
          if ($exe.FullName -ne $target) {
            Copy-Item -Path $exe.FullName -Destination $target -Force
          }

      - name: Upload exe installer
        uses: actions/upload-artifact@v5
        with:
          name: exe-installer
          path: build/release/EdamameAgent.exe
          if-no-files-found: error

  create-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [source-and-jar, deb-installer, exe-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/source-and-jar/EdamameAgent-source.zip \
            release-assets/source-and-jar/EdamameAgent.jar \
            release-assets/deb-installer/EdamameAgent.deb \
            release-assets/exe-installer/EdamameAgent.exe \
            --verify-tag \
            --generate-notes
