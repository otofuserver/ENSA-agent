name: Release Artifacts

on:
  workflow_run:
    workflows:
      - Java Compatibility
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  jar-asset:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Build jar
        run: ./gradlew clean prepareReleaseInput --no-daemon --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: jar-asset
          path: |
            build/release/EdamameAgent.jar
          if-no-files-found: error

  deb-installer:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Build deb installer
        run: ./gradlew clean packageDebInstaller --no-daemon --console=plain

      - name: Normalize deb artifact name
        run: |
          DEB_PATH="$(find build/release -type f -name '*.deb' | head -n 1)"
          if [ -z "$DEB_PATH" ]; then
            echo "No .deb file found under build/release"
            exit 1
          fi
          if [ "$(basename "$DEB_PATH")" != "EdamameAgent.deb" ]; then
            cp "$DEB_PATH" build/release/EdamameAgent.deb
          fi

      - name: Upload deb installer
        uses: actions/upload-artifact@v7
        with:
          name: deb-installer
          path: build/release/EdamameAgent.deb
          if-no-files-found: error

  exe-installer:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build exe installer
        run: .\gradlew.bat clean packageExeInstaller --no-daemon --console=plain

      - name: Upload exe installer
        uses: actions/upload-artifact@v7
        with:
          name: exe-installer
          path: build/release/*.exe
          if-no-files-found: error

  create-release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') && github.event.workflow_run.head_repository.full_name == github.repository
    needs: [jar-asset, deb-installer, exe-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Generate release notes from CHANGELOG
        run: |
          chmod +x .github/scripts/extract-release-notes.sh
          VERSION="${{ github.event.workflow_run.head_branch }}"
          VERSION="${VERSION#v}"
          .github/scripts/extract-release-notes.sh "$VERSION" RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.event.workflow_run.head_branch }}" \
            release-assets/jar-asset/EdamameAgent.jar \
            release-assets/deb-installer/*.deb \
            release-assets/exe-installer/*.exe \
            --verify-tag \
            --notes-file RELEASE_NOTES.md
